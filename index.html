<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Ramanand Dubey | Full Stack Developer Portfolio</title>

    <meta
      name="description"
      content="Explore Ramanand Dubey's developer portfolio featuring React, JavaScript, Next.js, Node.js, Tailwind CSS, responsive web development, and modern web applications."
    />

    <meta
      name="keywords"
      content="Ramanand Dubey, Full Stack Developer, Web Developer, React Developer, JavaScript Developer, Next.js Developer, Node.js, Tailwind CSS, Portfolio"
    />

    <meta name="author" content="Ramanand Dubey" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL: Keep this aligned with your live domain -->
    <link rel="canonical" href="https://portfolio-zeta-livid-16.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" sizes="any" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon-16x16.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />

    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph: Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ramanand Dubey Portfolio" />

    <meta property="og:title" content="Ramanand Dubey | Full Stack Developer" />

    <meta
      property="og:description"
      content="Discover my web development projects, technical skills, and experience building modern, responsive web applications."
    />

    <meta
      property="og:url"
      content="https://portfolio-zeta-livid-16.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://portfolio-zeta-livid-16.vercel.app/images/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Ramanand Dubey's Full Stack Developer Portfolio"
    />

    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Sharing -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Ramanand Dubey | Full Stack Developer"
    />

    <meta
      name="twitter:description"
      content="Explore my web development projects and skills in React, JavaScript, Next.js, and modern web technologies."
    />

    <meta
      name="twitter:image"
      content="https://portfolio-zeta-livid-16.vercel.app/images/og-image.png"
    />

    <!-- Performance: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Person and Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ramanand Dubey",
        "url": "https://portfolio-zeta-livid-16.vercel.app/",
        "jobTitle": "Full Stack Developer",
        "knowsAbout": [
          "Web Development",
          "JavaScript",
          "React",
          "Next.js",
          "Php",
          "Node.js",
          "Tailwind CSS",
          "Java"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
