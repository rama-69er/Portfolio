    <circle cx="50" cy="165" r="20"/>
    <circle cx="85" cy="210" r="24"/>
    <circle cx="60" cy="290" r="22"/>
  </g>
  <!-- Ivy leaves right -->
  <g fill="#2b6135" opacity="0.85">
    <circle cx="1160" cy="50" r="28"/>
    <circle cx="1120" cy="100" r="32"/>
    <circle cx="1170" cy="160" r="25"/>
    <circle cx="1130" cy="220" r="30"/>
    <circle cx="1160" cy="310" r="32"/>
  </g>
